{% extends "base.html" %}
{% block title %}Verify OTP · SplitMate{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="form-card">
        <h2 class="fw-bold">Verify Your Email</h2>
        <p class="text-muted">
            Enter the 6-digit OTP sent to your registered email.
            OTP expires in 5 minutes.
        </p>


    <form method="post">
        <label class="form-label">Enter OTP</label>
        <input
            class="form-control mb-3"
            type="text"
            name="otp"
            placeholder="000000"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            minlength="6"
            required
            autocomplete="one-time-code"
        >

        <button class="btn btn-primary w-100" type="submit">
            Verify OTP
        </button>
    </form>

    <p class="mt-3 mb-0 text-center small">
        <a href="{{ url_for('auth.forgot_password') }}">
            Request a new OTP
        </a>
    </p>
</div>


</div>
{% endblock %}
