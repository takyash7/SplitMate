{% extends "base.html" %}
{% block title %}Forgot Password · SplitMate{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="form-card">
        <h2 class="fw-bold">Forgot Password?</h2>
        <p class="text-muted">
            Enter your registered email. We'll send you a password reset OTP.
        </p>


    <form method="post">
        <label class="form-label">Registered Email</label>
        <input
            class="form-control mb-3"
            type="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
        >

        <button class="btn btn-primary w-100" type="submit">
            Send OTP
        </button>
    </form>

    <p class="mt-3 mb-0 text-center small">
        <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </p>
</div>


</div>
{% endblock %}
