{% extends "base.html" %}
{% block title %}Create account · SplitMate{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="form-card">
<h2 class="fw-bold">Create your account</h2><p class="text-muted">Your groups and history will be saved to your account.</p>
<form method="post">
  <label class="form-label">Full name</label><input class="form-control mb-3" name="name" maxlength="100" required autocomplete="name">
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required autocomplete="email">
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="8" required autocomplete="new-password">
  <div class="form-text mb-3">Use at least 8 characters.</div>
  <button class="btn btn-primary w-100">Create account</button>
</form><p class="mt-3 mb-0 text-center small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div></div>
{% endblock %}
