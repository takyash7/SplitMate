{% extends "base.html" %}
{% block title %}Reset Password · SplitMate{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="form-card">
        <h2 class="fw-bold">Set New Password</h2>
        <p class="text-muted">
            Create a new password for your SplitMate account.
        </p>

    <form method="post">
        <label class="form-label">New Password</label>
        <input
            class="form-control mb-3"
            type="password"
            name="password"
            minlength="8"
            required
            autocomplete="new-password"
        >

        <label class="form-label">Confirm New Password</label>
        <input
            class="form-control mb-3"
            type="password"
            name="confirm_password"
            minlength="8"
            required
            autocomplete="new-password"
        >

        <button class="btn btn-primary w-100" type="submit">
            Reset Password
        </button>
    </form>
</div>


</div>
{% endblock %}
